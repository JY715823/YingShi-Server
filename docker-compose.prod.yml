# ============================================================
# YingShi Production Docker Compose (8443 端口方案)
# ============================================================
# 免备案：使用 8443 端口提供 HTTPS 服务，避开 80/443 端口的备案拦截
#
# 端口规划：
#   80   → Let's Encrypt 证书验证 + HTTP→HTTPS 跳转
#   8443 → HTTPS 主服务（API + 下载页 + APK 下载）
#
# 使用方法：
#   1. cp .env.example .env 并配置所有变量
#   2. SSL 证书申请（首次）：
#      docker run --rm \
#        -v /opt/yingshi/nginx/certs:/etc/letsencrypt \
#        -v /opt/yingshi/nginx/www:/var/www/certbot \
#        certbot/certbot certonly --webroot -w /var/www/certbot \
#        -d yingshi92.xyz --email 1085060329@qq.com --agree-tos --no-eff-email
#   3. docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # ---- Nginx HTTPS 反向代理 ----
  nginx:
    image: nginx:1.27-alpine
    container_name: yingshi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./nginx/nginx-8443.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/www:/var/www/certbot:ro
      - ./nginx/download:/usr/share/nginx/download:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      - yingshi-net

  # ---- PostgreSQL ----
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    # 生产环境：不暴露端口到宿主机，仅容器网络可达
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    networks:
      - yingshi-net

  # ---- MinIO 对象存储 ----
  minio:
    extends:
      file: docker-compose.yml
      service: minio
    # 生产环境：不暴露端口到宿主机，仅容器网络可达
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    networks:
      - yingshi-net

  minio-init:
    extends:
      file: docker-compose.yml
      service: minio-init
    networks:
      - yingshi-net

  # ---- Spring Boot 应用 ----
  server:
    extends:
      file: docker-compose.yml
      service: server
    # 生产环境：仅绑定 localhost，由 Nginx 处理外部访问
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8080}:8080"
    # 健康检查：Nginx 依赖 server 健康才启动
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - yingshi-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.00'

networks:
  yingshi-net:
    driver: bridge
