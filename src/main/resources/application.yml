spring:
  application:
    name: yingshi-server
  profiles:
    default: dev
  datasource:
    hikari:
      pool-size: ${HIKARI_POOL_SIZE:20}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:550MB}
  mvc:
    throw-exception-if-no-handler-found: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: ping
          show-details: always
        readiness:
          include: db
          show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  production-safety:
    enabled: ${APP_PRODUCTION_SAFETY_ENABLED:false}
  auth:
    jwt:
      issuer: yingshi-server
      access-token-ttl: PT30M
      refresh-token-ttl: P7D
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
      window: ${AUTH_RATE_LIMIT_WINDOW:PT5M}
    account-lockout:
      enabled: ${AUTH_ACCOUNT_LOCKOUT_ENABLED:true}
      max-attempts: ${AUTH_ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
      lock-duration: ${AUTH_ACCOUNT_LOCKOUT_DURATION:PT15M}
    login-code:
      length: ${AUTH_LOGIN_CODE_LENGTH:6}
      ttl: ${AUTH_LOGIN_CODE_TTL:PT5M}
      resend-cooldown: ${AUTH_LOGIN_CODE_RESEND_COOLDOWN:PT60S}
      rate-limit-window: ${AUTH_LOGIN_CODE_RATE_LIMIT_WINDOW:PT30M}
      max-sends-per-window: ${AUTH_LOGIN_CODE_MAX_SENDS_PER_WINDOW:5}
      max-attempts-per-challenge: ${AUTH_LOGIN_CODE_MAX_ATTEMPTS_PER_CHALLENGE:5}
    remembered-login:
      ttl: ${AUTH_REMEMBERED_LOGIN_TTL:P7D}
    mail:
      enabled: ${AUTH_MAIL_ENABLED:true}
      host: ${AUTH_MAIL_HOST:smtp.qq.com}
      port: ${AUTH_MAIL_PORT:587}
      username: ${AUTH_MAIL_USERNAME:1085060329@qq.com}
      password: ${AUTH_MAIL_PASSWORD:}
      from-address: ${AUTH_MAIL_FROM_ADDRESS:1085060329@qq.com}
      from-name: ${AUTH_MAIL_FROM_NAME:映世}
      auth: ${AUTH_MAIL_AUTH:true}
      starttls: ${AUTH_MAIL_STARTTLS:true}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:yingshi-media}
    local-root: ${STORAGE_LOCAL_ROOT:local-storage}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    cdn-domain: ${STORAGE_CDN_DOMAIN:}
    cdn-auth-key: ${STORAGE_CDN_AUTH_KEY:}
    cdn-sign-param: ${STORAGE_CDN_SIGN_PARAM:sign}
    cdn-timestamp-param: ${STORAGE_CDN_TIMESTAMP_PARAM:t}
    signed-url-ttl: ${STORAGE_SIGNED_URL_TTL:PT15M}
    direct-upload-enabled: ${STORAGE_DIRECT_UPLOAD_ENABLED:false}
    direct-upload-public-endpoint: ${STORAGE_DIRECT_UPLOAD_PUBLIC_ENDPOINT:}
    force-path-style: ${STORAGE_FORCE_PATH_STYLE:true}
  push:
    self-fallback-enabled: ${PUSH_SELF_FALLBACK_ENABLED:false}
    fcm:
      enabled: ${FCM_ENABLED:false}
      dry-run: ${FCM_DRY_RUN:false}
      project-id: ${FCM_PROJECT_ID:}
      service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
      service-account-json-base64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:}
    token-cleanup:
      enabled: ${APP_PUSH_TOKEN_CLEANUP_ENABLED:true}
      fixed-delay-millis: ${APP_PUSH_TOKEN_CLEANUP_FIXED_DELAY_MILLIS:3600000}   # 每小时
      initial-delay-millis: ${APP_PUSH_TOKEN_CLEANUP_INITIAL_DELAY_MILLIS:300000} # 启动后5分钟
