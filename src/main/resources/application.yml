spring:
  application:
    name: yingshi-server
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1100MB
  mvc:
    throw-exception-if-no-handler-found: true

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  production-safety:
    enabled: ${APP_PRODUCTION_SAFETY_ENABLED:false}
  auth:
    jwt:
      issuer: yingshi-server
      access-token-ttl: PT30M
      refresh-token-ttl: P7D
  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:yingshi-media}
    local-root: ${STORAGE_LOCAL_ROOT:local-storage}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    cdn-domain: ${STORAGE_CDN_DOMAIN:}
    cdn-auth-key: ${STORAGE_CDN_AUTH_KEY:}
    cdn-sign-param: ${STORAGE_CDN_SIGN_PARAM:sign}
    cdn-timestamp-param: ${STORAGE_CDN_TIMESTAMP_PARAM:t}
    signed-url-ttl: ${STORAGE_SIGNED_URL_TTL:PT15M}
    direct-upload-enabled: ${STORAGE_DIRECT_UPLOAD_ENABLED:false}
    force-path-style: ${STORAGE_FORCE_PATH_STYLE:true}
  push:
    fcm:
      enabled: ${FCM_ENABLED:false}
      dry-run: ${FCM_DRY_RUN:false}
      project-id: ${FCM_PROJECT_ID:}
      service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
      service-account-json-base64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:}
