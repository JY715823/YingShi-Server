spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/yingshi}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:yingshi}
    password: ${SPRING_DATASOURCE_PASSWORD:yingshi_dev_password}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration/postgresql

logging:
  level:
    root: INFO
    com.yingshi.server: INFO

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    jwt:
      secret: ${APP_AUTH_JWT_SECRET:change-me-to-a-long-dev-secret-at-least-32-characters}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    bucket: ${STORAGE_BUCKET:yingshi-media}
    endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:yingshi_minio_access}
    secret-key: ${STORAGE_SECRET_KEY:yingshi_minio_secret}
    local-root: ${STORAGE_LOCAL_ROOT:local-storage}
    cdn-domain: ${STORAGE_CDN_DOMAIN:}
    cdn-auth-key: ${STORAGE_CDN_AUTH_KEY:}
    cdn-sign-param: ${STORAGE_CDN_SIGN_PARAM:sign}
    cdn-timestamp-param: ${STORAGE_CDN_TIMESTAMP_PARAM:t}
    signed-url-ttl: ${STORAGE_SIGNED_URL_TTL:PT15M}
    direct-upload-enabled: ${STORAGE_DIRECT_UPLOAD_ENABLED:false}
    direct-upload-public-endpoint: ${STORAGE_DIRECT_UPLOAD_PUBLIC_ENDPOINT:}
    force-path-style: ${STORAGE_FORCE_PATH_STYLE:true}

yingshi:
  dev:
    test-import:
      enabled: false
    recovery:
      enabled: false
