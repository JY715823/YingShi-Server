# YingShi Server — Production Profile
# This profile enforces strict security settings for production deployments.
# Activate with: SPRING_PROFILES_ACTIVE=prod

spring:
  flyway:
    baseline-on-migrate: false
  datasource:
    hikari:
      # FR-9: Production HikariCP tuning
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # FR-2: Expose health and prometheus for internal monitoring (restricted by nginx to internal network)
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: ping
          show-details: always
        readiness:
          include: db
          show-details: never

logging:
  level:
    root: WARN
    com.yingshi.server: INFO

server:
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      trusted-proxies: 127.0.0.1,172.16.0.0/12,10.0.0.0/8

app:
  production-safety:
    enabled: true
  dev-seed:
    enabled: false
  auth:
    rate-limit:
      # R2-H-G7: 生产环境启用 trustForwardedHeaders, 让 RateLimitFilter 从 X-Forwarded-For 解析真实客户端 IP
      trust-forwarded-headers: true
