spring:
  datasource:
    url: jdbc:h2:file:./local-storage/dev-db/yingshi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.yingshi.server: DEBUG

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  auth:
    jwt:
      secret: dev-secret-key-for-yingshi-server-minimum-length-32
  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:yingshi-media}
    local-root: ${STORAGE_LOCAL_ROOT:local-storage}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}

yingshi:
  dev:
    test-import:
      enabled: false
