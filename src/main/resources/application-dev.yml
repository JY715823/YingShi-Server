spring:
  datasource:
    url: jdbc:h2:file:./local-storage/dev-db/yingshi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.yingshi.server: DEBUG

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  auth:
    jwt:
      secret: dev-secret-key-for-yingshi-server-minimum-length-32
    login-code:
      length: ${AUTH_LOGIN_CODE_LENGTH:6}
      ttl: ${AUTH_LOGIN_CODE_TTL:PT5M}
      resend-cooldown: ${AUTH_LOGIN_CODE_RESEND_COOLDOWN:PT60S}
      rate-limit-window: ${AUTH_LOGIN_CODE_RATE_LIMIT_WINDOW:PT30M}
      max-sends-per-window: ${AUTH_LOGIN_CODE_MAX_SENDS_PER_WINDOW:5}
      max-attempts-per-challenge: ${AUTH_LOGIN_CODE_MAX_ATTEMPTS_PER_CHALLENGE:5}
    mail:
      enabled: ${AUTH_MAIL_ENABLED:true}
      host: ${AUTH_MAIL_HOST:smtp.qq.com}
      port: ${AUTH_MAIL_PORT:587}
      username: ${AUTH_MAIL_USERNAME:1085060329@qq.com}
      password: ${AUTH_MAIL_PASSWORD:}
      from-address: ${AUTH_MAIL_FROM_ADDRESS:1085060329@qq.com}
      from-name: ${AUTH_MAIL_FROM_NAME:映世}
      auth: ${AUTH_MAIL_AUTH:true}
      starttls: ${AUTH_MAIL_STARTTLS:true}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:yingshi-media}
    local-root: ${STORAGE_LOCAL_ROOT:local-storage}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}

yingshi:
  dev:
    test-import:
      enabled: false
