# ============================================================
# YingShi Server - Nginx HTTPS Reverse Proxy
# ============================================================
# 标准 443 端口方案（ICP 备案已通过：蜀ICP备2026042518号）
#
# 端口规划：
#   80  → Let's Encrypt 证书验证 + HTTP→HTTPS 跳转
#   443 → HTTPS 主服务（API + 下载页 + APK 下载）
# ============================================================

# ---- R0-A: 限流配置 ----
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
# R2-H-G3: SSE 独立 limit_conn_zone, 避免长连接占用 API 连接配额
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

# ---- HTTP (80) → Let's Encrypt 验证 + HTTPS 跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name yingshi92.xyz;

    # Let's Encrypt 证书验证（webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (443) 主服务 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yingshi92.xyz;

    # ---- R2-H-G2: 限流命中时返回 429 状态码 ----
    limit_req_status 429;
    limit_conn_status 429;

    # ---- SSL 证书 ----
    ssl_certificate     /etc/letsencrypt/live/yingshi92.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yingshi92.xyz/privkey.pem;

    # ---- SSL 加固 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ---- 安全头 ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 请求体大小（匹配 Spring Boot multipart 500MB） ----
    client_max_body_size 550M;

    # ---- 超时 ----
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # ---- 下载页（根路径） ----
    location = / {
        root /usr/share/nginx/download;
        try_files /index.html =404;
    }

    # ---- APK 文件强制下载（正则 location 优先级高于前缀，先匹配） ----
    location ~* ^/download/(.+\.apk)$ {
        alias /usr/share/nginx/download/$1;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # ---- 下载目录列表（非 APK 文件，如 index.html） ----
    location /download/ {
        alias /usr/share/nginx/download/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # ---- Actuator 健康检查（限制内网） ----
    location /actuator/ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 文件上传（严格限流 + 大 body） ----
    location /api/upload/ {
        limit_req zone=upload burst=5 nodelay;
        limit_conn conn 5;
        client_max_body_size 550m;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- SSE 长连接（独立 location，超长超时） ----
    location /api/sse/ {
        # R2-H-G3: 使用独立的 sse_conn zone, 避免长连接占用 API 连接配额
        limit_conn sse_conn 10;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 必需：关闭缓冲 + 超长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- R2-H-G4: ZIP 上传独立 location (大 body + 严格限流, 避免被通用 /api/ 的 10m body 限制拒绝) ----
    location /api/chat/imported/upload-zip {
        limit_req zone=upload burst=3 nodelay;
        limit_conn conn 3;
        client_max_body_size 55m;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- R2-H-G4: 聊天导入媒体独立 location (10m body + API 限流) ----
    location /api/chat/imported/media/ {
        limit_req zone=api burst=10 nodelay;
        limit_conn conn 10;
        client_max_body_size 10m;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- API 反代到 Spring Boot（限流） ----
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 20;
        client_max_body_size 10m;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- 其他路径反代到 Spring Boot ----
    location / {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
