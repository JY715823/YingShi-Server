# ============================================================
# YingShi Server - Nginx 8443 HTTPS Reverse Proxy
# ============================================================
# 8443 端口方案：免备案（避开 80/443 端口的备案拦截）
#
# 端口规划：
#   80   → Let's Encrypt 证书验证 + HTTP→HTTPS 跳转
#   8443 → HTTPS 主服务（API + 下载页 + APK 下载）
#
# SSL 证书申请（部署时执行）：
#   docker run --rm \
#     -v /opt/yingshi/nginx/certs:/etc/letsencrypt \
#     -v /opt/yingshi/nginx/www:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d yingshi92.xyz --email your-email@example.com --agree-tos --no-eff-email
# ============================================================

# ---- HTTP (80) → Let's Encrypt 验证 + HTTPS 跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name yingshi92.xyz;

    # Let's Encrypt 证书验证（webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求跳转到 8443 HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ---- HTTPS (8443) 主服务 ----
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name yingshi92.xyz;

    # ---- SSL 证书 ----
    ssl_certificate     /etc/letsencrypt/live/yingshi92.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yingshi92.xyz/privkey.pem;

    # ---- SSL 加固 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ---- 安全头 ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 请求体大小（匹配 Spring Boot multipart 500MB） ----
    client_max_body_size 550M;

    # ---- 超时 ----
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # ---- 下载页（根路径） ----
    location = / {
        root /usr/share/nginx/download;
        try_files /index.html =404;
    }

    # ---- APK 文件强制下载（正则 location 优先级高于前缀，先匹配） ----
    location ~* ^/download/(.+\.apk)$ {
        alias /usr/share/nginx/download/$1;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # ---- 下载目录列表（非 APK 文件，如 index.html） ----
    location /download/ {
        alias /usr/share/nginx/download/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # ---- Actuator 健康检查（限制内网） ----
    location /actuator/ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- SSE 长连接（独立 location，超长超时） ----
    location /api/sse/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 必需：关闭缓冲 + 超长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- API 反代到 Spring Boot ----
    location / {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
