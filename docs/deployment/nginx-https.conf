# ============================================================
# YingShi Server - Nginx HTTPS Reverse Proxy Configuration
# ============================================================
# Place this in /etc/nginx/conf.d/ or /etc/nginx/sites-enabled/
#
# SSL certificate setup:
#   Option A (Let's Encrypt):
#     certbot certonly --nginx -d api.yingshi.example.com
#   Option B (Cloud provider):
#     Download cert files and place in /etc/nginx/ssl/
#
# Reload Nginx after changes:
#   nginx -t && systemctl reload nginx
# ============================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.yingshi.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yingshi.example.com;

    # ---- SSL Certificates ----
    ssl_certificate     /etc/letsencrypt/live/api.yingshi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yingshi.example.com/privkey.pem;

    # ---- SSL Hardening ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ---- Security Headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Request Size ----
    # Match Spring Boot multipart: max-file-size=500MB, max-request-size=550MB
    client_max_body_size 550M;

    # ---- Timeouts ----
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # ---- Main API Proxy ----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Forward real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Use $remote_addr (not $proxy_add_x_forwarded_for) to prevent IP spoofing
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Gzip
        proxy_set_header Accept-Encoding "";
    }

    # ---- Actuator Health (restrict to localhost) ----
    location /actuator/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
