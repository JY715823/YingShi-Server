# ============================================================
# YingShi Server - Nginx HTTPS Reverse Proxy Configuration
# ============================================================
# Place this in /etc/nginx/conf.d/ or /etc/nginx/sites-enabled/
#
# SSL certificate setup:
#   Option A (Let's Encrypt):
#     certbot certonly --nginx -d api.yingshi.example.com
#   Option B (Cloud provider):
#     Download cert files and place in /etc/nginx/ssl/
#
# Reload Nginx after changes:
#   nginx -t && systemctl reload nginx
# ============================================================

# ---- R0-A: 限流配置 ----
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
# R2-H-G3: SSE 独立 limit_conn_zone, 避免长连接占用 API 连接配额
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.yingshi.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yingshi.example.com;

    # ---- R2-H-G2: 限流命中时返回 429 状态码 ----
    limit_req_status 429;
    limit_conn_status 429;

    # ---- SSL Certificates ----
    ssl_certificate     /etc/letsencrypt/live/api.yingshi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yingshi.example.com/privkey.pem;

    # ---- SSL Hardening ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ---- Security Headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Request Size ----
    # Match Spring Boot multipart: max-file-size=500MB, max-request-size=550MB
    client_max_body_size 550M;

    # ---- Timeouts ----
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # ---- Actuator Health (restrict to localhost) ----
    location /actuator/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 文件上传（严格限流 + 大 body） ----
    location /api/upload/ {
        limit_req zone=upload burst=5 nodelay;
        limit_conn conn 5;
        client_max_body_size 550m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- SSE 长连接（独立 location，超长超时） ----
    # FR-5: SSE requires proxy_buffering off to stream events in real-time
    location /api/sse/ {
        # R2-H-G3: 使用独立的 sse_conn zone, 避免长连接占用 API 连接配额
        limit_conn sse_conn 10;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE critical settings
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # Extended timeouts for long-lived SSE connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- R2-H-G4: ZIP 上传独立 location (大 body + 严格限流, 避免被通用 /api/ 的 10m body 限制拒绝) ----
    location /api/chat/imported/upload-zip {
        limit_req zone=upload burst=3 nodelay;
        limit_conn conn 3;
        client_max_body_size 55m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- R2-H-G4: 聊天导入媒体独立 location (10m body + API 限流) ----
    location /api/chat/imported/media/ {
        limit_req zone=api burst=10 nodelay;
        limit_conn conn 10;
        client_max_body_size 10m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- API 反代到 Spring Boot（限流） ----
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 20;
        client_max_body_size 10m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- Main API Proxy (其他路径) ----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Forward real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Use $remote_addr (not $proxy_add_x_forwarded_for) to prevent IP spoofing
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Gzip
        proxy_set_header Accept-Encoding "";
    }
}
