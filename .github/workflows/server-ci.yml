name: Server CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yingshi-test
          POSTGRES_USER: yingshi
          POSTGRES_PASSWORD: yingshi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/yingshi-test
          SPRING_DATASOURCE_USERNAME: yingshi
          SPRING_DATASOURCE_PASSWORD: yingshi_test_password
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw -B verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yingshi-test
          POSTGRES_USER: yingshi
          POSTGRES_PASSWORD: yingshi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yingshi-server:test .

      - name: Verify image starts
        run: |
          docker run -d --name yingshi-test \
            --add-host host.docker.internal:host-gateway \
            -e SPRING_PROFILES_ACTIVE=test \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/yingshi-test \
            -e SPRING_DATASOURCE_USERNAME=yingshi \
            -e SPRING_DATASOURCE_PASSWORD=yingshi_test_password \
            -p 8080:8080 \
            yingshi-server:test
          sleep 30
          curl -sf http://localhost:8080/api/health || exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f yingshi-test || true
