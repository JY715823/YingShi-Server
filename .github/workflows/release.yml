name: Release (Production)

# R3-F-3: 生产发布审批工作流
# 手动触发，需 production 环境审批人确认后才会执行 deploy
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.2.3)'
        required: true
        type: string

concurrency:
  group: release-production
  # 发布流程不允许被取消，避免半完成状态
  cancel-in-progress: false

jobs:
  # ============================================================
  # P0 门禁 job：所有 job 必须通过，deploy 才会执行
  # ============================================================
  build-and-test:
    name: Build & Test (Release Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: test
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: ./mvnw -B verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: target/surefire-reports/
          retention-days: 7

  migration-test:
    name: Migration Tests (Release Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run V24 orphan data migration test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: ./mvnw -B test -Dtest=V24OrphanDataMigrationTest

      - name: Run V1→current full migration chain
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: ./mvnw -B test -Dtest="*MigrationTest" -DfailIfNoTests=false

  docker-build:
    name: Docker Build & Scan (Release Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: migration-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yingshi-server:test .

      - name: Trivy vulnerability scan
        # 扫描失败不阻断构建，但记录报告
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: yingshi-server:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Record image digest
        id: image_digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' yingshi-server:test)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image digest: $DIGEST"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push to GHCR
        run: |
          docker tag yingshi-server:test ghcr.io/yingshi/yingshi-server:latest
          docker tag yingshi-server:test ghcr.io/yingshi/yingshi-server:sha-${{ github.sha }}
          docker push ghcr.io/yingshi/yingshi-server:latest
          docker push ghcr.io/yingshi/yingshi-server:sha-${{ github.sha }}

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-trivy-report
          path: trivy-results.sarif
          retention-days: 14

  dependency-scan:
    name: OWASP Dependency-Check (Release Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency-Check
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 14

  secret-scan:
    name: Secret Scan (Release Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Deploy：production 环境审批 + 所有 P0 门禁通过后执行
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # R3-F-3: production 环境配置 required reviewers，需人工审批
    environment: production
    needs: [build-and-test, migration-test, docker-build, dependency-scan, secret-scan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production server
        id: deploy
        env:
          YINGSHI_SSH_HOST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          YINGSHI_REMOTE_DIR: /opt/yingshi
        run: |
          echo "Deploying version ${{ inputs.version_tag }} (SHA ${{ github.sha }})..."
          bash scripts/deploy-server.sh

      - name: Record release
        if: success()
        env:
          YINGSHI_SSH_HOST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          YINGSHI_REMOTE_DIR: /opt/yingshi
        run: |
          echo "Deploy successful, writing release record..."
          bash scripts/release-record.sh

      - name: Rollback on failure
        if: failure()
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          YINGSHI_REMOTE_DIR: /opt/yingshi
        run: |
          echo "::error::Deploy failed, initiating automatic rollback..."
          # 从上一次成功发布记录中取出镜像 digest 作为回滚目标
          PREV_DIGEST=$(ls -t releases/release-*.txt 2>/dev/null | head -2 | tail -1 \
            | xargs grep -h "Image Digest:" 2>/dev/null | head -1 | awk '{print $3}')
          if [ -z "$PREV_DIGEST" ] || [ "$PREV_DIGEST" = "unknown" ]; then
            echo "::error::No previous release record found for rollback. Manual intervention required."
            exit 1
          fi
          echo "Rolling back to previous image: $PREV_DIGEST"
          # 上传 rollback 脚本到服务器并执行
          scp scripts/rollback.sh ${SSH_USER}@${SSH_HOST}:/tmp/rollback.sh
          ssh ${SSH_USER}@${SSH_HOST} "cd /opt/yingshi && bash /tmp/rollback.sh '$PREV_DIGEST'" || true
          echo "::error::Rollback attempted. Please verify server status manually."
          exit 1
